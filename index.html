<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nail 1 – Beauty Salon | Danbury, CT</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rose: #c9847a;
    --deep-rose: #a05f57;
    --blush: #f5e6e3;
    --cream: #fdf8f6;
    --charcoal: #2c2c2c;
    --mid-gray: #6b6b6b;
    --light-gray: #e8e8e8;
    --gold: #c8a96e;
    --white: #ffffff;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Montserrat', sans-serif;
    color: var(--charcoal);
    background: var(--cream);
    overflow-x: hidden;
  }

  /* ========== NAVBAR ========== */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(10px);
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    transition: background 0.3s;
  }

  nav {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.3rem, 2.5vw, 1.6rem);
    font-weight: 700;
    color: var(--rose);
    text-decoration: none;
    letter-spacing: 1px;
  }

  .nav-logo span {
    color: var(--gold);
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--charcoal);
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: color 0.3s;
    cursor: pointer;
  }

  .nav-links a:hover { color: var(--rose); }

  .nav-cta {
    background: var(--rose);
    color: var(--white) !important;
    padding: 10px 22px;
    border-radius: 30px;
    transition: background 0.3s !important;
    white-space: nowrap;
  }

  .nav-cta:hover { background: var(--deep-rose) !important; color: var(--white) !important; }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 8px;
    min-height: 44px;
    min-width: 44px;
    align-items: center;
    justify-content: center;
  }

  .hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--charcoal);
    border-radius: 2px;
    transition: all 0.3s;
  }

  #mobile-menu {
    display: none;
    flex-direction: column;
    background: var(--white);
    position: absolute;
    top: 70px;
    left: 0; right: 0;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    padding: 20px 24px;
    gap: 4px;
  }

  #mobile-menu.open { display: flex; }

  #mobile-menu a {
    text-decoration: none;
    color: var(--charcoal);
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 14px 0;
    border-bottom: 1px solid var(--light-gray);
    display: block;
    cursor: pointer;
    min-height: 44px;
    display: flex;
    align-items: center;
    transition: color 0.3s;
  }

  #mobile-menu a:last-child { border-bottom: none; }
  #mobile-menu a:hover { color: var(--rose); }
  #mobile-menu a.mobile-cta {
    background: var(--rose);
    color: var(--white);
    border-radius: 8px;
    padding: 14px 20px;
    margin-top: 8px;
    border: none;
    justify-content: center;
  }

  /* ========== HERO ========== */
  #hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .hero-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(160,95,87,0.72) 0%, rgba(44,44,44,0.55) 100%);
    z-index: 1;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 100px 24px 60px;
    max-width: 800px;
    margin: 0 auto;
  }

  .hero-badge {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    color: var(--white);
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 20px;
    border-radius: 30px;
    margin-bottom: 24px;
    backdrop-filter: blur(6px);
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 7vw, 5rem);
    color: var(--white);
    line-height: 1.1;
    margin-bottom: 16px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.3);
  }

    color: rgba(255,255,255,0.9);
